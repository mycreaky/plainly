<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plainly - 서식 제거 &amp; 줄바꿈 정리</title>
<style>
  :root {
    --bg: #f7f7f8; --fg: #1c1c1e; --card: #fff; --border: #d9d9de; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --fg: #ececf0; --card: #202024; --border: #3a3a40; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px; background: var(--bg); color: var(--fg);
    font: 16px/1.5 -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  body { display: flex; gap: 24px; align-items: flex-start; }
  nav { flex: 0 0 180px; position: sticky; top: 24px; display: flex; flex-direction: column; gap: 6px; }
  nav .brand { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; }
  nav button { text-align: left; }
  nav button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  main { flex: 1; min-width: 0; max-width: 760px; margin: 0 auto; }
  section[hidden] { display: none; }
  input[type="text"] {
    width: 100%; padding: 8px 12px; background: var(--card); color: inherit;
    border: 1px solid var(--border); border-radius: 8px; font: inherit;
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .preview {
    min-height: 3em; max-height: 240px; overflow: auto; padding: 12px; white-space: pre-wrap; word-break: break-word;
    background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  }
  .preview mark { background: #fde047; color: #1c1c1e; border-radius: 2px; }
  .error { color: #dc2626; }
  .opts { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
  .opts label { display: inline-flex; gap: 6px; margin: 0; font-weight: 400; cursor: pointer; }
  @media (max-width: 600px) {
    body { flex-direction: column; }
    nav { position: static; flex: none; width: 100%; flex-direction: row; flex-wrap: wrap; align-items: center; }
    nav .brand { width: 100%; margin: 0; }
  }
  h1 { margin: 0 0 4px; font-size: 1.6rem; }
  p.sub { margin: 0 0 20px; opacity: .7; }
  label { display: block; margin: 16px 0 6px; font-weight: 600; }
  textarea {
    width: 100%; min-height: 180px; padding: 12px; resize: vertical;
    background: var(--card); color: inherit; border: 1px solid var(--border); border-radius: 8px;
    font: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  button {
    padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: inherit; font: inherit; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .status { opacity: .7; font-size: .9rem; }
</style>
</head>
<body>
<nav aria-label="메뉴">
  <div class="brand">Plainly</div>
  <button type="button" data-tool="plain" aria-current="page">서식 제거 · 줄바꿈 정리</button>
  <button type="button" data-tool="swap">공백 ↔ 줄바꿈</button>
  <button type="button" data-tool="replace">찾기 · 바꾸기</button>
</nav>
<main>
<section id="tool-plain">
  <h1>Plainly</h1>
  <p class="sub">붙여넣은 텍스트의 서식을 모두 제거하고, 연속된 줄바꿈을 하나로 줄여줍니다.</p>

  <label for="input">입력</label>
  <textarea id="input" placeholder="여기에 텍스트를 입력하거나 붙여넣으세요" autofocus></textarea>

  <label for="output">결과</label>
  <textarea id="output" readonly></textarea>
  <div class="row">
    <button id="copy" class="primary" type="button">결과 복사</button>
    <button id="clear" type="button">지우기</button>
    <span id="status" class="status" aria-live="polite"></span>
  </div>
</section>

<section id="tool-swap" hidden>
  <h1>공백 ↔ 줄바꿈</h1>
  <p class="sub">문장의 공백을 줄바꿈으로, 또는 줄바꿈을 공백으로 변환합니다.</p>

  <div class="opts">
    <label><input type="radio" name="dir" value="s2n" checked> 공백 → 줄바꿈</label>
    <label><input type="radio" name="dir" value="n2s"> 줄바꿈 → 공백</label>
  </div>

  <label for="swap-input">입력</label>
  <textarea id="swap-input" placeholder="여기에 문장을 입력하세요"></textarea>

  <label for="swap-output">결과</label>
  <textarea id="swap-output" readonly></textarea>
  <div class="row">
    <button id="swap-copy" class="primary" type="button">결과 복사</button>
    <button id="swap-clear" type="button">지우기</button>
    <span id="swap-status" class="status" aria-live="polite"></span>
  </div>
</section>

<section id="tool-replace" hidden>
  <h1>찾기 · 바꾸기</h1>
  <p class="sub">문장에서 키워드를 찾아 다른 문자열로 바꿉니다. 정규식도 사용할 수 있습니다.</p>

  <label for="rp-find">찾을 내용</label>
  <input type="text" id="rp-find" autocomplete="off" spellcheck="false">
  <label for="rp-with">바꿀 내용</label>
  <input type="text" id="rp-with" autocomplete="off" spellcheck="false">
  <div class="opts">
    <label><input type="checkbox" id="rp-regex"> 정규식</label>
    <label><input type="checkbox" id="rp-case"> 대소문자 구분</label>
  </div>

  <label for="rp-input">입력</label>
  <textarea id="rp-input" placeholder="여기에 문장을 입력하세요"></textarea>

  <label>찾은 결과 미리보기</label>
  <div id="rp-preview" class="preview" aria-live="polite"></div>

  <label for="rp-output">결과</label>
  <textarea id="rp-output" readonly></textarea>
  <div class="row">
    <button id="rp-copy" class="primary" type="button">결과 복사</button>
    <button id="rp-clear" type="button">지우기</button>
    <span id="rp-status" class="status" aria-live="polite"></span>
  </div>
</section>
</main>

<script>
  const input = document.getElementById('input');
  const output = document.getElementById('output');
  const status = document.getElementById('status');

  function toPlain(text) {
    return text
      .replace(/\r\n?|\u2028|\u2029/g, '\n')        // 줄바꿈 통일
      .replace(/<[^>]*>/g, '')                         // HTML 태그 제거
      .replace(/[\u200B-\u200D\uFEFF]/g, '')          // 보이지 않는 문자 제거
      .replace(/\u00A0/g, ' ')                        // nbsp -> 공백
      .replace(/[ \t]+$/gm, '')                        // 줄 끝 공백 제거
      .replace(/\n{2,}/g, '\n');                       // 2개 이상 줄바꿈 -> 1개
  }

  function update() {
    output.value = toPlain(input.value);
  }

  function flash(msg) {
    status.textContent = msg;
    setTimeout(() => { status.textContent = ''; }, 1500);
  }

  // 서식 있는 내용을 붙여넣어도 text/plain 만 사용
  input.addEventListener('paste', (e) => {
    const plain = e.clipboardData && e.clipboardData.getData('text/plain');
    if (plain == null) return;
    e.preventDefault();
    input.setRangeText(plain, input.selectionStart, input.selectionEnd, 'end');
    update();
  });
  input.addEventListener('input', update);

  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(output.value);
      flash('복사됨');
    } catch {
      output.select();
      document.execCommand('copy');
      flash('복사됨');
    }
  });

  document.getElementById('clear').addEventListener('click', () => {
    input.value = '';
    update();
    input.focus();
  });

  // ---- 공백 <-> 줄바꿈 ----
  const swapIn = document.getElementById('swap-input');
  const swapOut = document.getElementById('swap-output');
  const swapStatus = document.getElementById('swap-status');

  function swap(text, dir) {
    text = text.replace(/\r\n?|\u2028|\u2029/g, '\n');
    return dir === 'n2s'
      ? text.replace(/\n+/g, ' ').trim()
      : text.trim().replace(/[ \t\u00A0\u3000]+/g, '\n');
  }
  function swapUpdate() {
    const dir = document.querySelector('input[name="dir"]:checked').value;
    swapOut.value = swap(swapIn.value, dir);
  }
  swapIn.addEventListener('input', swapUpdate);
  document.querySelectorAll('input[name="dir"]').forEach((r) => r.addEventListener('change', swapUpdate));

  document.getElementById('swap-copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(swapOut.value);
    } catch {
      swapOut.select();
      document.execCommand('copy');
    }
    swapStatus.textContent = '복사됨';
    setTimeout(() => { swapStatus.textContent = ''; }, 1500);
  });
  document.getElementById('swap-clear').addEventListener('click', () => {
    swapIn.value = '';
    swapUpdate();
    swapIn.focus();
  });

  // ---- 찾기 · 바꾸기 ----
  const rp = (id) => document.getElementById(id);
  const rpStatus = rp('rp-status');

  function rpUpdate() {
    const find = rp('rp-find').value;
    const text = rp('rp-input').value;
    rpStatus.classList.remove('error');
    rpStatus.textContent = '';
    const preview = rp('rp-preview');
    preview.textContent = text;
    if (!find) { rp('rp-output').value = text; return; }
    const isRegex = rp('rp-regex').checked;
    const flags = 'g' + (rp('rp-case').checked ? '' : 'i');
    try {
      const re = new RegExp(isRegex ? find : find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), flags);
      const rep = rp('rp-with').value;
      const count = (text.match(re) || []).length;
      rp('rp-output').value = isRegex ? text.replace(re, rep) : text.replace(re, () => rep);
      rpStatus.textContent = count + '건 변경';

      // 일치 부분 하이라이트
      preview.textContent = '';
      let last = 0, m;
      while ((m = re.exec(text)) !== null) {
        if (m[0] === '') { re.lastIndex++; continue; }
        preview.append(text.slice(last, m.index));
        const mark = document.createElement('mark');
        mark.textContent = m[0];
        preview.append(mark);
        last = m.index + m[0].length;
      }
      preview.append(text.slice(last));
    } catch (e) {
      rp('rp-output').value = '';
      rpStatus.classList.add('error');
      rpStatus.textContent = '정규식 오류: ' + e.message;
    }
  }
  ['rp-find', 'rp-with', 'rp-input'].forEach((id) => rp(id).addEventListener('input', rpUpdate));
  ['rp-regex', 'rp-case'].forEach((id) => rp(id).addEventListener('change', rpUpdate));
  rp('rp-copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(rp('rp-output').value);
    } catch {
      rp('rp-output').select();
      document.execCommand('copy');
    }
    rpStatus.classList.remove('error');
    rpStatus.textContent = '복사됨';
  });
  rp('rp-clear').addEventListener('click', () => {
    rp('rp-input').value = '';
    rpUpdate();
    rp('rp-input').focus();
  });

  // ---- 사이드바 ----
  document.querySelectorAll('nav button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('nav button').forEach((b) => b.removeAttribute('aria-current'));
      btn.setAttribute('aria-current', 'page');
      document.querySelectorAll('main > section').forEach((sec) => {
        sec.hidden = sec.id !== 'tool-' + btn.dataset.tool;
      });
    });
  });
</script>
</body>
</html>
